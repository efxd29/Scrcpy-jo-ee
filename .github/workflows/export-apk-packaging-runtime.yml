name: Export APK signing tool

on:
  push:
    branches:
      - fix/connect-timeout-20261013
    paths:
      - ".github/workflows/export-apk-packaging-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;36.0.0"
      - name: Collect APK signing tools
        run: |
          set -euo pipefail
          OUT=apk-signing-tools
          mkdir -p "$OUT"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$OUT/apksigner.jar"
          sha256sum "$OUT/apksigner.jar"
          ls -lh "$OUT/apksigner.jar"
      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: scropy-apk-signing-tools
          path: apk-signing-tools/
          if-no-files-found: error
          retention-days: 2
